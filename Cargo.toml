[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/khangdev20/opsbox"

[workspace.dependencies]
# internal
opsbox-capacity = { path = "crates/opsbox-capacity" }
opsbox-alerts = { path = "crates/opsbox-alerts" }
opsbox-proto = { path = "crates/opsbox-proto" }
opsbox-backup = { path = "crates/opsbox-backup" }
opsbox-deploy = { path = "crates/opsbox-deploy" }
opsbox-docker = { path = "crates/opsbox-docker" }
opsbox-store = { path = "crates/opsbox-store" }
opsbox-priv = { path = "crates/opsbox-priv" }
opsbox-api = { path = "crates/opsbox-api" }
opsbox-auth = { path = "crates/opsbox-auth" }
opsbox-metrics = { path = "crates/opsbox-metrics" }
opsbox-proxy = { path = "crates/opsbox-proxy" }
opsbox-update = { path = "crates/opsbox-update" }
opsbox-version = { path = "crates/opsbox-version" }
opsbox-watchdog = { path = "crates/opsbox-watchdog" }

[workspace.lints.rust]
# No unsafe code anywhere. If a future change truly needs it, relax this per crate
# with a comment explaining why.
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
