name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (the comment names the release).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check
      - name: API route documentation
        run: python3 tools/generate-api.py --check
      - name: Proxy Network UI contracts
        run: node tools/check-network-ui.mjs
      - name: Stable live lists (data-flip)
        run: node tools/check-flip-ui.mjs
      - name: Update status text
        run: node tools/check-update-status.mjs
      - name: Mock-only API allowlist
        run: node tools/check-mock-api.mjs
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Idle memory budget
        run: python3 tools/check-idle-memory.py --binary target/release/opsbox
      - name: Lint install.sh
        run: shellcheck --shell=sh --severity=warning install.sh tools/stamp-version.sh tools/check-installer-channel.sh
      - name: Installer keeps the update channel
        run: sh tools/check-installer-channel.sh

      - name: Install cargo-deny and cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zig-venv"
          "$RUNNER_TEMP/zig-venv/bin/pip" install --quiet cargo-zigbuild ziglang
          echo "$RUNNER_TEMP/zig-venv/bin" >> "$GITHUB_PATH"
          DENY_VER="0.21.0"
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VER}/cargo-deny-${DENY_VER}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/zig-venv/bin" --strip-components=1 "cargo-deny-${DENY_VER}-x86_64-unknown-linux-musl/cargo-deny"

      - name: Dependency audit (cargo deny)
        run: cargo deny check

      - name: Build static musl targets
        run: |
          cargo zigbuild --release --locked \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl

      - name: Report binary sizes
        run: |
          {
            echo "### Static musl binary sizes"
            echo ""
            echo "| Target | Size |"
            echo "|---|---|"
            for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
              bin="target/$t/release/opsbox"
              bytes="$(stat -c%s "$bin")"
              human="$(numfmt --to=iec-i --suffix=B "$bytes")"
              echo "| \`$t\` | $human ($bytes bytes) |"
              echo "$t: $human ($bytes bytes)" >&2
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Dry run of the release stamping with a made-up tag; the files are restored after.
      - name: Version stamping (dry run)
        run: |
          sh tools/stamp-version.sh v9.9.9-alpha.1
          OPSBOX_BUILD_VERSION=9.9.9-alpha.1 cargo build --locked -p opsbox
          got="$(target/debug/opsbox --version)"
          git checkout -- Cargo.toml Cargo.lock
          [ "$got" = "opsbox 9.9.9-alpha.1" ] || { echo "opsbox --version printed '$got'" >&2; exit 1; }
