name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build, signing, and SBOM tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tools-venv"
          "$RUNNER_TEMP/tools-venv/bin/pip" install --quiet cargo-zigbuild ziglang
          echo "$RUNNER_TEMP/tools-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          SYFT_VER="1.26.1"
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VER}/syft_${SYFT_VER}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/tools-venv/bin" syft

      - name: Verify signing configuration
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "error: MINISIGN_SECRET_KEY secret is not set in the 'release' environment" >&2
            exit 1
          fi
          if ! grep -qE '^MINISIGN_PUBKEY="RW[^"]+"$' install.sh; then
            echo "error: MINISIGN_PUBKEY in install.sh is missing or empty" >&2
            exit 1
          fi

      - name: Build static musl targets
        run: |
          cargo zigbuild --release --locked \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl

      - name: Package, checksum, sign, and generate SBOM
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p dist
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          clean_key="$(printf '%s' "$MINISIGN_SECRET_KEY" | tr -d '\r')"
          case "$clean_key" in
            "untrusted comment:"*)
              printf '%s\n' "$clean_key" > "$KEY_FILE"
              ;;
            *)
              printf 'untrusted comment: minisign encrypted secret key\n%s\n' "$clean_key" > "$KEY_FILE"
              ;;
          esac
          chmod 600 "$KEY_FILE"

          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            pkg="opsbox-${VERSION}-${t}"
            stage="$RUNNER_TEMP/${pkg}"
            rm -rf "$stage"
            mkdir -p "$stage/systemd"
            cp "target/${t}/release/opsbox" "$stage/opsbox"
            chmod 755 "$stage/opsbox"
            cp packaging/systemd/opsbox.service packaging/systemd/opsbox-priv.service packaging/systemd/opsbox-proxy.service packaging/systemd/opsbox-watchdog.service "$stage/systemd/"
            tar -C "$RUNNER_TEMP" -czf "dist/${pkg}.tar.gz" "$pkg"
            (cd dist && sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256")
            if [ -n "${MINISIGN_PASSWORD:-}" ]; then
              printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm "dist/${pkg}.tar.gz" -s "$KEY_FILE" -t "opsbox ${TAG} (${t})"
            else
              minisign -Sm "dist/${pkg}.tar.gz" -s "$KEY_FILE" -t "opsbox ${TAG} (${t})" </dev/null
            fi
          done

          syft dir:. -o cyclonedx-json="dist/opsbox-${VERSION}.cdx.json"
          cp install.sh dist/install.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$TAG" \
            --title "opsbox $TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            dist/*
