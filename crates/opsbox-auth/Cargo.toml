[package]
name = "opsbox-auth"
description = "Accounts, passwords, TOTP sign-in, sessions, lockout and setup tokens."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
opsbox-proto.workspace = true
opsbox-store.workspace = true
opsbox-priv.workspace = true
argon2 = { version = "0.6", features = ["alloc"] }
base64 = "0.23"
getrandom = "0.4"
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
