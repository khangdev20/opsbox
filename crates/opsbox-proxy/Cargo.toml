[package]
name = "opsbox-proxy"
description = "Reverse proxy, routing table, ACME and certificates (Phase 4)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
opsbox-proto.workspace = true
opsbox-priv.workspace = true
bytes = "1"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
nix = { version = "0.32", default-features = false, features = ["user"] }
rustls-pki-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
ureq = "3"
webpki-roots = "1"
x509-parser = "0.18"
zeroize = "1.9"

[dev-dependencies]
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
tempfile = "3.27"
time = "0.3"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "test-util"] }
tokio-tungstenite = "0.30"

[lints]
workspace = true
