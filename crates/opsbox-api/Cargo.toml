[package]
name = "opsbox-api"
description = "HTTP server: axum router, request ids, error format, health endpoints and the embedded web UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
opsbox-backup.workspace = true
opsbox-proto.workspace = true
opsbox-deploy.workspace = true
opsbox-store.workspace = true
opsbox-priv.workspace = true
opsbox-auth.workspace = true
opsbox-metrics.workspace = true
opsbox-proxy.workspace = true
opsbox-update.workspace = true
rustix = { version = "1.1", features = ["fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "ws"] }
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
ureq = "3"
rust-embed = { version = "8.14", features = ["include-exclude", "mime-guess"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["limit", "timeout", "compression-gzip"] }
tracing = "0.1"
ulid = "3.0"

[dev-dependencies]
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hmac = "0.13"
instant-acme = { version = "0.8", default-features = false }
rcgen14 = { package = "rcgen", version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
time = "0.3"
tokio-tungstenite = "0.30"
http-body-util = "0.1"
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
