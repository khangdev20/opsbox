[package]
name = "opsbox-docker"
description = "Docker Engine client wrapper, compose, image and volume management (Phase 3)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
opsbox-proto.workspace = true
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
