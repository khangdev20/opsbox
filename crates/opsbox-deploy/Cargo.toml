[package]
name = "opsbox-deploy"
description = "GitHub integration, build detection, build, release, health check and rollback (Phase 3)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.23"
getrandom = "0.4"
hmac = "0.13"
opsbox-proto = { path = "../opsbox-proto" }
pem = "4"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }
ureq = "3"
url = "2.5"
yaml-rust2 = { version = "0.13", default-features = false }
zeroize = "1.9"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
