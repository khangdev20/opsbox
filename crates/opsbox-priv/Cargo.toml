[package]
name = "opsbox-priv"
description = "Privileged helper: a Unix-socket server that runs a closed set of typed operations as root, and the client `serve` uses to call it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
opsbox-proto.workspace = true
base64 = "0.23"
chacha20poly1305 = "0.11"
getrandom = "0.4"
hmac = "0.13"
nix = { version = "0.32", default-features = false, features = ["user", "fs", "feature", "signal"] }
serde = "1.0"
sha1 = "0.11"
serde_json = "1.0"
sha2 = "0.11"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "net", "io-util", "time", "sync", "macros", "process"] }
tracing = "0.1"
zeroize = "1.9"
pty-process = { version = "0.5", features = ["async"] }

[dev-dependencies]
proptest = "1.12"
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs"] }

[lints]
workspace = true
