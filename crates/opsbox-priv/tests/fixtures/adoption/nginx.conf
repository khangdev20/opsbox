# listen 80; untouched comment
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server ipv6only=on;
    server_name old.test www.old.test;
    ssl_certificate /etc/letsencrypt/live/old.test/fullchain.pem;
    location / { proxy_pass http://app:8080; }
}
server {
    listen 80;
    listen 443 ssl;
    server_name second.test;
}
