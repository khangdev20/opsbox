[package]
name = "opsbox-watchdog"
description = "Health checks, restart and rollback policy, and the safe-mode server (Phase 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
opsbox-version.workspace = true
opsbox-proto.workspace = true
opsbox-store.workspace = true
argon2 = { version = "0.6", features = ["alloc"] }
base64 = "0.23"
chacha20poly1305 = "0.11"
getrandom = "0.4"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
nix = { version = "0.32", default-features = false, features = ["fs", "user", "signal"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls-pki-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "net", "time", "io-util", "sync", "macros", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
